apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: client-gateway
  name: client-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-gateway
  strategy: {}
  template:
    metadata:
      labels:
        app: client-gateway
    spec:
      containers:
      - image: us-east4-docker.pkg.dev/tienda-ms-481308/image-register/client-gateway
        name: client-gateway
        env:
        - name: PORT
          value: "3000"
        - name: PRODUCT_MICROSERVICE_HOST
          value: "localhost"
        - name: PRODUCT_MICROSERVICE_PORT
          value: "3001"
        - name: ORDER_MICROSERVICE_HOST
          value: "localhost"
        - name: ORDER_MICROSERVICE_PORT
          value: "3002"
        - name: NATS_SERVERS
          value: "nats://nats"
        resources: {}
status: {}
