apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orders-ms
  name: orders-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-ms
  strategy: {}
  template:
    metadata:
      labels:
        app: orders-ms
    spec:
      containers:
      - image: us-east4-docker.pkg.dev/tienda-ms-481308/image-register/orders-ms
        name: orders-ms
        env:
        - name: PORT
          value: "3003"
        - name: NATS_SERVERS
          value: "nats://nats:4222"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: orders-secrets
              key: database_url
        - name: PRODUCT_MICROSERVICE_HOST
          value: "products-ms"
        - name: PRODUCT_MICROSERVICE_PORT
          value: "3002"
        resources: {}
status: {}
